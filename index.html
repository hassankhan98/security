A.copy=async()=>{let src=S.shifts.filter(s=>s.date>=addD(wk,-7)&&s.date<=addD(wk,-1)&&(!fs||s.siteId==fs)),n=0;if(!src.length)return alert('No shifts in previous week');if(!confirm(`Copy ${src.length} shifts from last week?`))return;for(let s of src){let{id,...d}=s;d.date=addD(d.date,7);let[a,b]=span(d);if(S.shifts.some(x=>x.officerId==d.officerId&&(([p,r])=>a<r&&b>p)(span(x))))continue;await sv('shifts',null,d);n++}alert(n+' shifts copied (conflicts skipped)')};

A.cfg=()=>A.form('Company settings',[['company','Company name'],['address','Address'],['vat','VAT %','number'],['night','Night multiplier','number'],['we','Weekend multiplier','number'],['bhm','Bank holiday multiplier','number'],['otm','Overtime multiplier','number'],['ot','Overtime after hours/week','number'],['bh','Bank holiday dates (YYYY-MM-DD, comma separated)'],['terms','Invoice terms'],['bank','Bank details']].map(([k,l,t])=>({k,l,t})),cfg(),d=>sv('settings','main',d));

dash(){let m=pm,mh=S.shifts.filter(s=>s.date.startsWith(m)),H=mh.reduce((a,s)=>a+hrs(s),0),pr=S.officers.reduce((a,o)=>{let r=calc(o,m),v=S.payroll.find(x=>x.id==o.id+'_'+m)||{};return a+r.pay+(v.add||0)-(v.ded||0)},0),rev=S.invoices.filter(i=>i.date.startsWith(m)).reduce((a,i)=>a+i.total,0),out=S.invoices.reduce((a,i)=>a+i.total-i.paid,0);

const mkInv=async(st,from,to,no)=>{let sh=S.shifts.filter(x=>x.siteId==st.id&&x.date>=from&&x.date<=to);if(!sh.length)return 0;let h=0,net=0;sh.forEach(x=>{let t=hrs(x);h+=t;net+=t*brate(st,x)});net=+net.toFixed(2);let vp=cfg().vat,vat=+(net*vp/100).toFixed(2);await sv('invoices',null,{siteId:st.id,from,to,no:'INV-'+no,date:iso(new Date()),hours:+h.toFixed(2),rate:+(net/h).toFixed(2),net,vatPct:vp,vat,total:+(net+vat).toFixed(2),paid:0});return 1};

const _r=V.rota;V.rota=()=>{let out=_r();if(!grid)return out;let ds=[...Array(7)].map((_,i)=>addD(wk,i)),l=rl();return out.slice(0,out.lastIndexOf('<div class="card">'))+`<div class="card w"><table><tr><th>Officer</th>${ds.map(d=>`<th>${new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})}</th>`).join('')}<th>Hours</th></tr>${S.officers.filter(o=>(!fo||o.id==fo)&&o.status!='Left').map(o=>`<tr><td>${e(o.name)}</td>${ds.map(d=>`<td style="cursor:pointer;min-width:95px" onclick="A.cell('${o.id}','${d}')">${l.filter(x=>x.officerId==o.id&&x.date==d).map(x=>`<div class="tag" onclick="event.stopPropagation();A.shift('${x.id}')">${e(sn(x.siteId))}<br>${x.start}-${x.end}</div>`).join('')||'<span style="color:var(--m)">+</span>'}</td>`).join('')}<td>${l.filter(x=>x.officerId==o.id).reduce((a,x)=>a+hrs(x),0).toFixed(1)}</td></tr>`).join('')}</table><small>Click a cell to add a shift, click a shift to edit.</small></div>`};
