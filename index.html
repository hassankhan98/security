<meta charset="UTF-8">

<style>
:root{
  --primary:#1e3a5f;--primary-dark:#152a45;--accent:#e67e22;--success:#27ae60;
  --danger:#c0392b;--warn:#f39c12;--bg:#f5f7fa;--card:#fff;--text:#2c3e50;
  --muted:#7f8c8d;--border:#dce1e8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
button{cursor:pointer;font:inherit;border-radius:6px;border:1px solid var(--border);background:#fff;padding:.5rem 1rem;transition:all .15s}
button:hover{background:#f0f3f7}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.primary:hover{background:var(--primary-dark)}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.danger:hover{background:#a93226}
button.sm{padding:.3rem .6rem;font-size:.8rem}
input,select,textarea{padding:.5rem .7rem;border:1px solid var(--border);border-radius:6px;font:inherit;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
label{display:block;margin-bottom:.8rem}
label>span{display:block;font-weight:500;margin-bottom:.3rem;font-size:.85rem;color:#555}
.hidden{display:none!important}
.error{color:var(--danger);margin-top:.5rem;font-size:.85rem}
.hint{color:var(--muted);font-size:.8rem;margin-top:.5rem}

/* Auth */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f,#2c3e50);padding:1rem}
.auth-card{background:#fff;padding:2rem;border-radius:12px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.auth-card h1{text-align:center;margin-bottom:1.5rem;color:var(--primary);font-size:1.4rem}
.auth-tabs{display:flex;gap:.5rem;margin-bottom:1.2rem;border-bottom:1px solid var(--border)}
.auth-tab{flex:1;background:none;border:none;border-radius:0;padding:.6rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.auth-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.auth-card form{display:flex;flex-direction:column;gap:.8rem}

/* Layout */
#main-view{min-height:100vh;display:flex;flex-direction:column}
header{background:var(--primary);color:#fff;padding:.8rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.1rem}
header .user-info{display:flex;align-items:center;gap:1rem;font-size:.85rem}
header button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);padding:.4rem .8rem}
header button:hover{background:rgba(255,255,255,.25)}

nav#main-nav{background:#fff;border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;gap:.2rem;overflow-x:auto}
nav#main-nav button{background:none;border:none;border-radius:0;padding:.9rem 1rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav#main-nav button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;background:none}

main#page-content{flex:1;padding:1.5rem;max-width:1400px;width:100%;margin:0 auto}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.page-header h2{font-size:1.3rem;color:var(--primary)}
.page-actions{display:flex;gap:.5rem;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1rem;border-left:4px solid var(--primary)}
.stat-card .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:1.6rem;font-weight:700;color:var(--primary);margin-top:.3rem}
.stat-card .sub{font-size:.8rem;color:var(--muted);margin-top:.2rem}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--border);font-size:.9rem}
th{background:#eef2f7;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.3px;color:#555}
tr:hover td{background:#fafbfc}
.table-wrap{overflow-x:auto}

.empty{text-align:center;padding:2rem;color:var(--muted)}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:12px;font-size:.72rem;font-weight:600}
.badge.unpaid{background:#fdecea;color:var(--danger)}
.badge.paid{background:#e8f6ee;color:var(--success)}
.badge.partial{background:#fef5e7;color:var(--warn)}
.badge.active{background:#e8f6ee;color:var(--success)}
.badge.inactive{background:#eee;color:#777}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:1rem 1.2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.modal-header h3{font-size:1.1rem;color:var(--primary)}
.modal-close{background:none;border:none;font-size:1.5rem;padding:0 .3rem;line-height:1;color:var(--muted)}
.modal-body{padding:1.2rem}
.modal-footer{padding:1rem 1.2rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.5rem;position:sticky;bottom:0;background:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:520px){.form-row{grid-template-columns:1fr}}

/* Toast */
.toast{position:fixed;top:1rem;right:1rem;padding:.8rem 1.2rem;border-radius:8px;color:#fff;z-index:2000;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.week-nav{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.week-nav .label{font-weight:600;color:var(--primary)}

@media(max-width:640px){
  main#page-content{padding:1rem}

  header h1{font-size:.95rem}

/* =========================================================
   UTILITIES
   ========================================================= */
function getMonday(d){
  const date = new Date(d); date.setHours(0,0,0,0);
  const day = date.getDay() || 7;
  date.setDate(date.getDate() - day + 1);
  return date;
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtISO(d){ return d.toISOString().slice(0,10); }
function fmtDisplay(d){
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}
function fmtShort(d){ return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}); }
function fmtMoney(n){ return '£' + (Number(n)||0).toFixed(2); }
function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }

function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3000);

/* =========================================================
   ROTA MATH
   ========================================================= */
function calculateShiftHours(startTime, endTime, breakMinutes=0){
  let s = timeToMinutes(startTime), e = timeToMinutes(endTime);
  if(e <= s) e += 1440;
  const mins = Math.max(e - s - breakMinutes, 0);
  return Math.round((mins/60)*100)/100;
}

function hasOverlap(existingShifts, newShift){
  const ns = new Date(`${newShift.date}T${newShift.startTime}:00`).getTime();
  let ne = new Date(`${newShift.date}T${newShift.endTime}:00`).getTime();
  if(ne <= ns) ne += 86400000;
  return existingShifts.some(s => {
    const ss = new Date(`${s.date}T${s.startTime}:00`).getTime();
    let se = new Date(`${s.date}T${s.endTime}:00`).getTime();
    if(se <= ss) se += 86400000;
    return ns < se && ne > ss;
  });
}

function aggregateHoursByOfficer(rotas){
  const map = {};
  rotas.forEach(r => {
    const hrs = calculateShiftHours(r.startTime, r.endTime, r.breakMinutes||0);
    if(!map[r.officerId]) map[r.officerId] = { totalHours:0, shifts:[] };
    map[r.officerId].totalHours += hrs;
    map[r.officerId].shifts.push({ ...r, hours:hrs });
  });
  Object.values(map).forEach(v => v.totalHours = Math.round(v.totalHours*100)/100);
  return map;
}

function aggregateHoursBySite(rotas){
  const map = {};
  rotas.forEach(r => {
    const hrs = calculateShiftHours(r.startTime, r.endTime, r.breakMinutes||0);
    if(!map[r.siteId]) map[r.siteId] = 0;
    map[r.siteId] += hrs;
  });
  Object.keys(map).forEach(k => map[k] = Math.round(map[k]*100)/100);
  return map;
}

/* =========================================================
   PAYROLL
   ========================================================= */
const BANK_HOLIDAYS = [
  "2025-01-01","2025-04-18","2025-04-21","2025-05-05","2025-05-26",
  "2025-08-25","2025-12-25","2025-12-26",
  "2026-01-01","2026-04-03","2026-04-06","2026-05-04","2026-05-25",
  "2026-08-31","2026-12-25","2026-12-28"
];
function isWeekend(dateStr){ const d = new Date(dateStr+'T12:00:00').getDay(); return d===0||d===6; }
function isBankHoliday(dateStr){ return BANK_HOLIDAYS.includes(dateStr); }
function isNightShift(s){
  const start = timeToMinutes(s.startTime), end = timeToMinutes(s.endTime);
  return start >= 22*60 || end <= 6*60;
}
function getWeekKey(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const day = d.getDay()||7;
  const monday = new Date(d); monday.setDate(d.getDate()-day+1);
  const year = monday.getFullYear();
  const jan1 = new Date(year,0,1);
  const week = Math.ceil(((monday-jan1)/86400000 + jan1.getDay()+1)/7);
  return `${year}-W${String(week).padStart(2,'0')}`;
}

function calculateShiftPay(shift, officer, weeklyHoursSoFar=0){
  const hours = calculateShiftHours(shift.startTime, shift.endTime, shift.breakMinutes||0);
  const base = officer.hourlyRate || 0;
  let rate = base;
  if(isBankHoliday(shift.date))       rate = officer.bankHolidayRate || base*2;
  else if(isWeekend(shift.date))      rate = officer.weekendRate    || base*1.5;
  else if(isNightShift(shift))        rate = officer.nightRate      || base*1.25;

  const OT_THRESHOLD = 40;
  const otHours = Math.max(0, weeklyHoursSoFar + hours - OT_THRESHOLD);
  const normalHours = hours - otHours;
  const otRate = officer.overtimeRate || base*1.5;
  return normalHours*rate + otHours*otRate;
}

async function calculateMonthlySalary(officerId, month){
  const start = `${month}-01`, end = `${month}-31`;
  const [officer, rotas] = await Promise.all([
    db.collection('officers').doc(officerId).get().then(d=>({id:d.id,...d.data()})),
    getRotasForRange(start, end)
  ]);
  const myRotas = rotas.filter(r => r.officerId === officerId);
  myRotas.sort((a,b)=>a.date.localeCompare(b.date));

  let totalHours = 0, grossPay = 0;
  const breakdown = [];
  const weeks = {};
  myRotas.forEach(r => {
    const wk = getWeekKey(r.date);
    (weeks[wk] = weeks[wk]||[]).push(r);
  });
  for(const weekShifts of Object.values(weeks)){
    let wh = 0;
    weekShifts.forEach(s => {
      const hrs = calculateShiftHours(s.startTime, s.endTime, s.breakMinutes||0);
      const pay = calculateShiftPay(s, officer, wh);
      wh += hrs; totalHours += hrs; grossPay += pay;
      breakdown.push({ ...s, hours:hrs, pay:Math.round(pay*100)/100 });
    });
  }
  totalHours = Math.round(totalHours*100)/100;
  grossPay   = Math.round(grossPay*100)/100;
  return { officerId, officerName:officer.name, month, totalHours, grossPay, breakdown };
}

/* =========================================================
   FIRESTORE ACCESS
   ========================================================= */
async function getSites(){
  const snap = await db.collection('sites').get();
  return snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}
async function addSite(data){ return db.collection('sites').add({...data, createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }
async function updateSite(id, data){ return db.collection('sites').doc(id).update(data); }
async function deleteSite(id){ return db.collection('sites').doc(id).delete(); }

async function getOfficers(){
  const snap = await db.collection('officers').get();
  return snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}
async function addOfficer(data){ return db.collection('officers').add({...data, createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }
async function updateOfficer(id, data){ return db.collection('officers').doc(id).update(data); }
async function deleteOfficer(id){ return db.collection('officers').doc(id).delete(); }

async function getRotasForRange(start, end){
  const snap = await db.collection('rotas')
    .where('date','>=',start).where('date','<=',end).get();
  return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));
}
async function addRota(data){ return db.collection('rotas').add({...data, createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }
async function updateRota(id, data){ return db.collection('rotas').doc(id).update(data); }
async function deleteRota(id){ return db.collection('rotas').doc(id).delete(); }

async function savePayroll(rec){ return db.collection('payroll').add({...rec, createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }
async function getPayrollForMonth(m){
  const snap = await db.collection('payroll').where('month','==',m).get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function getInvoices(){
  const snap = await db.collection('invoices').get();
  return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.invoiceNumber||'').localeCompare(a.invoiceNumber||''));

async function saveInvoice(inv){ return db.collection('invoices').add({...inv, createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }
async function updateInvoice(id, data){ return db.collection('invoices').doc(id).update(data); }
async function deleteInvoice(id){ return db.collection('invoices').doc(id).delete(); }

async function refreshSites(){ state.sites = await getSites(); }
async function refreshOfficers(){ state.officers = await getOfficers(); }

/* =========================================================
   MODAL HELPERS
   ========================================================= */
function showModal(title, bodyHTML, onSubmit, opts={}){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" type="button">×</button>
        </div>
        <form id="modal-form">
          <div class="modal-body">${bodyHTML}</div>
          <div class="modal-footer">
            <button type="button" class="modal-cancel">Cancel</button>
            <button type="submit" class="primary">${opts.submitLabel||'Save'}</button>
          </div>
        </form>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  root.querySelector('.modal-close').onclick = close;
  root.querySelector('.modal-cancel').onclick = close;
  root.querySelector('.modal-backdrop').onclick = (e) => { if(e.target === e.currentTarget) close(); };
  root.querySelector('#modal-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await onSubmit(new FormData(e.target));
      close();
    } catch(err){
      alert('Error: ' + err.message);
      btn.disabled = false; btn.textContent = opts.submitLabel || 'Save';
    }
  };
  if(opts.onOpen) opts.onOpen(root);
}

function confirmAction(msg, onConfirm){
  if(confirm(msg)) onConfirm();
}

/* =========================================================
   PDF GENERATORS
   ========================================================= */
function pdfHeader(doc, title, subtitle){
  doc.setFont('helvetica','bold').setFontSize(20);
  doc.text(title, 14, 20);
  doc.setFont('helvetica','normal').setFontSize(10).setTextColor(100);
  doc.text('Security Company Ltd  •  VAT GB 123 4567 89', 14, 26);
  doc.setTextColor(0);
  if(subtitle){ doc.setFontSize(11).setFont('helvetica','bold'); doc.text(subtitle, 14, 36); }
  doc.setDrawColor(30,58,95).setLineWidth(0.5);
  doc.line(14, subtitle?40:30, 196, subtitle?40:30);
}

function generateSiteRotaPDF(siteName, shifts, weekLabel, officerMap, siteMap){
  const doc = new jsPDF({unit:'mm',format:'a4'});
  pdfHeader(doc, 'Weekly Site Rota', `${siteName}  •  ${weekLabel}`);
  let y = 50;
  doc.setFont('helvetica','bold').setFontSize(9).setFillColor(230,235,245);
  doc.rect(14, y-5, 182, 7, 'F');
  const cols = [14, 40, 75, 105, 125, 145, 168];
  ['Date','Site','Officer','Start','End','Break','Hours'].forEach((c,i)=>doc.text(c, cols[i], y));
  y += 6;
  doc.setFont('helvetica','normal').setFillColor(255);
  let total = 0;
  shifts.forEach((s,i)=>{
    const hrs = calculateShiftHours(s.startTime, s.endTime, s.breakMinutes||0);
    total += hrs;
    if(y > 275){ doc.addPage(); y = 20; }
    if(i%2===0){ doc.setFillColor(250,251,252); doc.rect(14,y-4,182,6,'F'); }
    doc.text(s.date, cols[0], y);
    doc.text((siteMap[s.siteId]?.name||'—').substring(0,20), cols[1], y);
    doc.text((officerMap[s.officerId]?.name||'—').substring(0,20), cols[2], y);
    doc.text(s.startTime, cols[3], y);
    doc.text(s.endTime, cols[4], y);
    doc.text(String(s.breakMinutes||0)+'m', cols[5], y);
    doc.text(hrs.toFixed(2), cols[6], y);
    y += 6;
  });
  y += 3;
  doc.setFont('helvetica','bold').setFontSize(11);
  doc.text(`Total shifts: ${shifts.length}`, 14, y);
  doc.text(`Total hours: ${total.toFixed(2)}`, 196, y, {align:'right'});
  doc.setFont('helvetica','italic').setFontSize(8).setTextColor(120);
  doc.text('Generated on ' + new Date().toLocaleString('en-GB'), 14, 288);
  doc.save(`rota-${siteName.replace(/\s+/g,'-')}-${weekLabel.replace(/[^\w]/g,'-')}.pdf`);
}

function generateTimesheetPDF(result, siteMap){
  const doc = new jsPDF({unit:'mm',format:'a4'});
  pdfHeader(doc, 'Monthly Timesheet', `${result.officerName}  •  ${result.month}`);
  let y = 50;
  doc.setFont('helvetica','bold').setFontSize(9).setFillColor(230,235,245);
  doc.rect(14, y-5, 182, 7, 'F');
  const cols = [14, 40, 85, 105, 125, 140, 165];
  ['Date','Site','Start','End','Break','Hours','Pay'].forEach((c,i)=>doc.text(c,cols[i],y));
  y += 6;
  doc.setFont('helvetica','normal').setFillColor(255);
  result.breakdown.forEach((s,i)=>{
    if(y > 275){ doc.addPage(); y = 20; }
    if(i%2===0){ doc.setFillColor(250,251,252); doc.rect(14,y-4,182,6,'F'); }
    doc.text(s.date, cols[0], y);
    doc.text((siteMap[s.siteId]?.name||'—').substring(0,22), cols[1], y);
    doc.text(s.startTime, cols[2], y);
    doc.text(s.endTime, cols[3], y);
    doc.text(String(s.breakMinutes||0)+'m', cols[4], y);
    doc.text(s.hours.toFixed(2), cols[5], y);
    doc.text(fmtMoney(s.pay), cols[6], y);
    y += 6;
  });
  y += 6;
  doc.setDrawColor(30,58,95);

  doc.text('Generated on ' + new Date().toLocaleString('en-GB'), 14, 288);

}

document.querySelectorAll('.auth-tab').forEach(tab=>{
  tab.onclick = () => {
    state.authMode = tab.dataset.auth;
    document.querySelectorAll('.auth-tab').forEach(t=>t.classList.toggle('active', t===tab));
    document.getElementById('auth-submit').textContent =
      state.authMode === 'signup' ? 'Create account' : 'Sign in';
    document.getElementById('auth-error').textContent = '';
  };
});

document.getElementById('auth-form').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  const btn = document.getElementById('auth-submit');
  btn.disabled = true; btn.textContent = 'Please wait…';
  try {
    if(state.authMode === 'signup'){
      await auth.createUserWithEmailAndPassword(email, pw);
      toast('Account created');
    } else {
      await auth.signInWithEmailAndPassword(email, pw);
    }
  } catch(err){
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = state.authMode === 'signup' ? 'Create account' : 'Sign in';
  }
};

document.getElementById('btn-logout').onclick = () => auth.signOut();

auth.onAuthStateChanged(async user => {
  state.user = user;
  if(user){
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('main-view').classList.remove('hidden');
    document.getElementById('user-email').textContent = user.email;
    try {
      await Promise.all([refreshSites(), refreshOfficers()]);
      renderPage(state.currentPage);
    } catch(err){
      document.getElementById('page-content').innerHTML =
        `<div class="card"><p class="error">Failed to load data. Have you enabled Firestore and set rules?<br>${err.message}</p></div>`;
    }
  } else {
    document.getElementById('login-view').classList.remove('hidden');
    document.getElementById('main-view').classList.add('hidden');
    state.sites = []; state.officers = [];
  }
});

async function renderPage(page){
  const c = document.getElementById('page-content');
  c.innerHTML = '<p style="padding:2rem;text-align:center;color:#888">Loading…</p>';
  try {
    if(page==='dashboard') await renderDashboard(c);
    else if(page==='sites') await renderSitesPage(c);
    else if(page==='officers') await renderOfficersPage(c);
    else if(page==='rota') await renderRotaPage(c);
    else if(page==='payroll') await renderPayrollPage(c);
    else if(page==='invoices') await renderInvoicesPage(c);
    else if(page==='reports') await renderReportsPage(c);
  } catch(err){
    c.innerHTML = `<div class="card"><p class="error">${err.message}</p></div>`;
  }
}

   ========================================================= */
async function renderDashboard(c){
  const weekStart = state.weekStart;
  const weekEnd = addDays(weekStart, 6);
  const month = new Date().toISOString().slice(0,7);
  const [rotas, invoices, payroll] = await Promise.all([
    getRotasForRange(fmtISO(weekStart), fmtISO(weekEnd)),
    getInvoices(),
    getPayrollForMonth(month)
  ]);
  const weekHours = rotas.reduce((s,r)=>s+calculateShiftHours(r.startTime,r.endTime,r.breakMinutes||0),0);
  const outstanding = invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+(i.total||0),0);
  const payrollTotal = payroll.reduce((s,p)=>s+(p.grossPay||0),0);
  const activeOfficers = state.officers.filter(o=>o.active!==false).length;

  c.innerHTML = `
    <div class="page-header"><h2>Dashboard</h2></div>
    <div class="stats">
      <div class="stat-card"><div class="label">Sites</div><div class="value">${state.sites.length}</div></div>
      <div class="stat-card"><div class="label">Active Officers</div><div class="value">${activeOfficers}</div><div class="sub">${state.officers.length} total</div></div>
      <div class="stat-card"><div class="label">This Week Hours</div><div class="value">${weekHours.toFixed(1)}</div><div class="sub">${rotas.length} shifts</div></div>
      <div class="stat-card"><div class="label">Outstanding Invoices</div><div class="value" style="color:var(--danger)">${fmtMoney(outstanding)}</div></div>
      <div class="stat-card"><div class="label">Payroll This Month</div><div class="value">${fmtMoney(payrollTotal)}</div><div class="sub">${payroll.length} records</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:.7rem;color:var(--primary)">This Week's Shifts</h3>
      ${rotas.length===0
        ? '<div class="empty">No shifts scheduled this week.</div>'
        : `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Site</th><th>Officer</th><th>Shift</th><th>Hours</th></tr></thead><tbody>
          ${rotas.slice(0,10).map(r=>{
            const site = state.sites.find(s=>s.id===r.siteId);
            const off = state.officers.find(o=>o.id===r.officerId);
            return `<tr>
              <td>${fmtShort(new Date(r.date+'T12:00:00'))}</td>
              <td>${site?.name||'—'}</td>
              <td>${off?.name||'—'}</td>
              <td>${r.startTime} – ${r.endTime}</td>
              <td>${calculateShiftHours(r.startTime,r.endTime,r.breakMinutes||0).toFixed(2)}</td>
            </tr>`;
          }).join('')}
        </tbody></table></div>`}
    </div>
  `;
}

async function renderRotaPage(c){
  const ws = state.weekStart, we = addDays(ws, 6);
  const [rotas] = await Promise.all([getRotasForRange(fmtISO(ws), fmtISO(we))]);
  const officerMap = Object.fromEntries(state.officers.map(o=>[o.id,o]));
  const siteMap = Object.fromEntries(state.sites.map(s=>[s.id,s]));

  const totalHours = rotas.reduce((s,r)=>s+calculateShiftHours(r.startTime,r.endTime,r.breakMinutes||0),0);

  c.innerHTML = `
    <div class="page-header">
      <h2>Weekly Rota</h2>
      <div class="page-actions">
        <button class="primary" id="btn-add-shift">+ Add shift</button>
        <button id="btn-copy-week">Copy previous week</button>
        <button id="btn-pdf-rota">Download PDF</button>
      </div>
    </div>
    <div class="card">
      <div class="week-nav">
        <button id="prev-week">← Previous</button>
        <span class="label">${fmtShort(ws)} → ${fmtShort(we)} ${ws.getFullYear()}</span>
        <button id="next-week">Next →</button>
        <button id="this-week">This week</button>
        <span style="margin-left:auto;color:var(--muted);font-size:.85rem">
          ${rotas.length} shifts • ${totalHours.toFixed(2)} hrs total
        </span>
      </div>
      ${rotas.length===0 ? '<div class="empty">No shifts this week.</div>' :
        `<div class="table-wrap"><table><thead><tr>
          <th>Date</th><th>Day</th><th>Site</th><th>Officer</th>
          <th>Start</th><th>End</th><th>Break</th><th>Hours</th><th></th>
        </tr></thead><tbody>
        ${rotas.map(r=>{
          const hrs = calculateShiftHours(r.startTime,r.endTime,r.breakMinutes||0);
          const dateObj = new Date(r.date+'T12:00:00');
          return `<tr>
            <td>${r.date}</td>
            <td>${dateObj.toLocaleDateString('en-GB',{weekday:'short'})}</td>
            <td>${siteMap[r.siteId]?.name||'—'}</td>
            <td>${officerMap[r.officerId]?.name||'—'}</td>
            <td>${r.startTime}</td>
            <td>${r.endTime}</td>
            <td>${r.breakMinutes||0}m</td>
            <td><strong>${hrs.toFixed(2)}</strong></td>
            <td>
              <button class="sm" data-edit-shift="${r.id}">Edit</button>
              <button class="sm danger" data-del-shift="${r.id}">Delete</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody></table></div>`}
    </div>`;

  document.getElementById('prev-week').onclick = () => { state.weekStart = addDays(ws,-7); renderRotaPage(c); };
  document.getElementById('next-week').onclick = () => { state.weekStart = addDays(ws,7); renderRotaPage(c); };
  document.getElementById('this-week').onclick = () => { state.weekStart = getMonday(new Date()); renderRotaPage(c); };
  document.getElementById('btn-add-shift').onclick = () => shiftForm(null, ws, c);

  document.getElementById('btn-copy-week').onclick = async () => {
    const prevStart = addDays(ws,-7), prevEnd = addDays(prevStart,6);
    const prev = await getRotasForRange(fmtISO(prevStart), fmtISO(prevEnd));
    if(prev.length===0) return toast('No shifts in previous week','error');
    for(const r of prev){
      const d = new Date(r.date+'T12:00:00');
      d.setDate(d.getDate()+7);
      await addRota({ siteId:r.siteId, officerId:r.officerId, date:fmtISO(d),
        startTime:r.startTime, endTime:r.endTime, breakMinutes:r.breakMinutes||0, shiftType:r.shiftType||'day' });
    }
    toast(`Copied ${prev.length} shifts`); renderRotaPage(c);
  };

  document.getElementById('btn-pdf-rota').onclick = () => {
    if(rotas.length===0) return toast('No shifts to export','error');
    generateSiteRotaPDF('All Sites', rotas, `${fmtShort(ws)} – ${fmtShort(we)} ${we.getFullYear()}`, officerMap, siteMap);
  };

  c.querySelectorAll('[data-edit-shift]').forEach(b => b.onclick = () => {
    shiftForm(rotas.find(r=>r.id===b.dataset.editShift), ws, c);
  });
  c.querySelectorAll('[data-del-shift]').forEach(b => b.onclick = () => {
    confirmAction('Delete this shift?', async ()=>{
      await deleteRota(b.dataset.delShift); toast('Shift deleted'); renderRotaPage(c);
    });
  });
}

function shiftForm(rota, ws, container){
  if(state.sites.length===0 || state.officers.length===0){
    return alert('Please add at least one site and one officer first.');
  }
  const siteOpts = state.sites.map(s=>`<option value="${s.id}" ${rota?.siteId===s.id?'selected':''}>${s.name}</option>`).join('');
  const offOpts = state.officers.filter(o=>o.active!==false).map(o=>`<option value="${o.id}" ${rota?.officerId===o.id?'selected':''}>${o.name}</option>`).join('');

  showModal(rota?'Edit Shift':'New Shift', `
    <label><span>Date *</span><input name="date" type="date" required value="${rota?.date||fmtISO(ws)}"></label>
    <div class="form-row">
      <label><span>Site *</span><select name="siteId" required>${siteOpts}</select></label>
      <label><span>Officer *</span><select name="officerId" required>${offOpts}</select></label>
    </div>
    <div class="form-row">
      <label><span>Start time *</span><input name="startTime" type="time" required value="${rota?.startTime||'09:00'}"></label>
      <label><span>End time *</span><input name="endTime" type="time" required value="${rota?.endTime||'17:00'}"></label>
    </div>
    <div class="form-row">
      <label><span>Break (minutes)</span><input name="breakMinutes" type="number" min="0" value="${rota?.breakMinutes||0}"></label>
      <label><span>Shift type</span>
        <select name="shiftType">
          <option value="day" ${rota?.shiftType!=='night'?'selected':''}>Day</option>
          <option value="night" ${rota?.shiftType==='night'?'selected':''}>Night</option>
        </select>
      </label>
    </div>
  `, async (fd) => {
    const data = {
      date: fd.get('date'),
      siteId: fd.get('siteId'),
      officerId: fd.get('officerId'),
      startTime: fd.get('startTime'),
      endTime: fd.get('endTime'),
      breakMinutes: parseInt(fd.get('breakMinutes')||'0',10),
      shiftType: fd.get('shiftType')
    };
    // Check overlap (exclude current shift if editing)
    const existing = await getRotasForRange(data.date, data.date);
    const others = existing.filter(x => x.officerId===data.officerId && (!rota || x.id!==rota.id));
    if(hasOverlap(others, data)){
      throw new Error('Conflict: this officer already has an overlapping shift on that date.');
    }
    if(rota) await updateRota(rota.id, data);
    else await addRota(data);
    toast(rota?'Shift updated':'Shift added');
    renderRotaPage(container);
  });
}

/* =========================================================
   PAYROLL PAGE
   ========================================================= */
async function renderPayrollPage(c){
  const now = new Date();
  const defaultMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const officerOpts = state.officers.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');

  c.innerHTML = `
    <div class="page-header"><h2>Payroll</h2></div>
    <div class="card">
      <div class="form-row">
        <label><span>Officer</span><select id="pay-officer">${officerOpts}</select></label>
        <label><span>Month</span><input type="month" id="pay-month" value="${defaultMonth}"></label>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:.5rem">
        <button class="primary" id="btn-calc-pay">Calculate salary</button>
        <button id="btn-load-payroll">Load saved payroll records</button>
      </div>
    </div>
    <div id="pay-result"></div>
  `;

  document.getElementById('btn-calc-pay').onclick = async () => {
    const officerId = document.getElementById('pay-officer').value;
    const month = document.getElementById('pay-month').value;
    if(!officerId || !month) return toast('Select officer and month','error');
    const result = await calculateMonthlySalary(officerId, month);
    const siteMap = Object.fromEntries(state.sites.map(s=>[s.id,s]));
    const div = document.getElementById('pay-result');
    div.innerHTML = `
      <div class="card">
        <h3 style="color:var(--primary);margin-bottom:.7rem">${result.officerName} — ${result.month}</h3>
        <div class="stats" style="margin-bottom:1rem">
          <div class="stat-card"><div class="label">Total Hours</div><div class="value">${result.totalHours}</div></div>
          <div class="stat-card"><div class="label">Gross Pay</div><div class="value">${fmtMoney(result.grossPay)}</div></div>
          <div class="stat-card"><div class="label">Shifts</div><div class="value">${result.breakdown.length}</div></div>
        </div>
        ${result.breakdown.length===0 ? '<div class="empty">No shifts in this month.</div>' :
          `<div class="table-wrap"><table><thead><tr>
            <th>Date</th><th>Site</th><th>Start</th><th>End</th><th>Break</th><th>Hours</th><th>Pay</th>
          </tr></thead><tbody>
            ${result.breakdown.map(s=>`<tr>
              <td>${s.date}</td>
              <td>${siteMap[s.siteId]?.name||'—'}</td>
              <td>${s.startTime}</td>
              <td>${s.endTime}</td>
              <td>${s.breakMinutes||0}m</td>
              <td>${s.hours.toFixed(2)}</td>
              <td>${fmtMoney(s.pay)}</td>
            </tr>`).join('')}
          </tbody></table></div>`}
        <div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="primary" id="btn-save-payroll">Save to payroll history</button>
          <button id="btn-ts-pdf">Download timesheet PDF</button>
          <button id="btn-ps-pdf">Download payslip PDF</button>
        </div>
      </div>`;
    document.getElementById('btn-save-payroll').onclick = async () => {
      await savePayroll(result);
      toast('Payroll saved to history');
    };
    document.getElementById('btn-ts-pdf').onclick = () => generateTimesheetPDF(result, siteMap);
    document.getElementById('btn-ps-pdf').onclick = () => generatePayslipPDF(result);
  };

  document.getElementById('btn-load-payroll').onclick = async () => {
    const month = document.getElementById('pay-month').value;
    const records = await getPayrollForMonth(month);
    const div = document.getElementById('pay-result');
    if(records.length===0){
      div.innerHTML = '<div class="card"><div class="empty">No saved payroll for this month.</div></div>';
      return;
    }
    div.innerHTML = `
      <div class="card">
        <h3 style="color:var(--primary);margin-bottom:.7rem">Saved Payroll — ${month}</h3>
        <div class="table-wrap"><table><thead><tr>
          <th>Officer</th><th>Total Hours</th><th>Gross Pay</th><th>Shifts</th>
        </tr></thead><tbody>
          ${records.map(r=>`<tr>
            <td>${r.officerName||'—'}</td>
            <td>${r.totalHours}</td>
            <td>${fmtMoney(r.grossPay)}</td>
            <td>${r.breakdown?.length||0}</td>
          </tr>`).join('')}
        </tbody></table></div>
      </div>`;
  };
}

/* =========================================================
   INVOICES PAGE
   ========================================================= */
async function renderInvoicesPage(c){
  const invoices = await getInvoices();
  c.innerHTML = `
    <div class="page-header">
      <h2>Invoices</h2>
      <div class="page-actions">
        <button class="primary" id="btn-gen-inv">+ Generate invoice from hours</button>
      </div>
    </div>
    <div class="card">
      ${invoices.length===0 ? '<div class="empty">No invoices yet.</div>' :
        `<div class="table-wrap"><table><thead><tr>
          <th>Invoice #</th><th>Client</th><th>Period</th><th>Subtotal</th><th>VAT</th><th>Total</th><th>Status</th><th>Actions</th>
        </tr></thead><tbody>
        ${invoices.map(inv=>`<tr>
          <td><strong>${inv.invoiceNumber}</strong></td>
          <td>${inv.clientName||'—'}</td>
          <td>${inv.period||'—'}</td>
          <td>${fmtMoney(inv.subtotal)}</td>
          <td>${fmtMoney(inv.vatAmount)}</td>
          <td><strong>${fmtMoney(inv.total)}</strong></td>
          <td><span class="badge ${inv.status||'unpaid'}">${inv.status||'unpaid'}</span></td>
          <td>
            <button class="sm" data-pdf-inv="${inv.id}">PDF</button>
            <button class="sm" data-toggle-inv="${inv.id}">${inv.status==='paid'?'Mark unpaid':'Mark paid'}</button>
            <button class="sm danger" data-del-inv="${inv.id}">Delete</button>
          </td>
        </tr>`).join('')}
        </tbody></table></div>`}
    </div>`;

  document.getElementById('btn-gen-inv').onclick = () => invoiceGenModal(c);

  c.querySelectorAll('[data-pdf-inv]').forEach(b => b.onclick = () => {
    const inv = invoices.find(i=>i.id===b.dataset.pdfInv);
    generateInvoicePDF(inv);
  });
  c.querySelectorAll('[data-toggle-inv]').forEach(b => b.onclick = async () => {
    const inv = invoices.find(i=>i.id===b.dataset.toggleInv);
    await updateInvoice(inv.id, { status: inv.status==='paid'?'unpaid':'paid' });
    renderInvoicesPage(c);
  });
  c.querySelectorAll('[data-del-inv]').forEach(b => b.onclick = () => {
    confirmAction('Delete this invoice?', async ()=>{
      await deleteInvoice(b.dataset.delInv); toast('Invoice deleted'); renderInvoicesPage(c);
    });
  });
}

function invoiceGenModal(container){
  const now = new Date();
  const defaultMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  showModal('Generate Invoice', `
    <label><span>Billing month *</span><input name="month" type="month" required value="${defaultMonth}"></label>
    <label><span>Client name *</span><input name="clientName" required placeholder="Acme Corporation Ltd"></label>
    <label><span>VAT rate (%)</span><input name="vatRate" type="number" step="0.01" value="20"></label>
    <p class="hint">Hours and totals are calculated from saved rota records and each site's billing rate.</p>
  `, async (fd) => {
    const month = fd.get('month');
    const vatRate = parseFloat(fd.get('vatRate'))||0;
    const start = `${month}-01`, end = `${month}-31`;
    const rotas = await getRotasForRange(start, end);
    if(rotas.length===0) throw new Error('No shifts found for that month. Add shifts first.');
    const siteHours = aggregateHoursBySite(rotas);
    const lineItems = [];
    let subtotal = 0;
    Object.entries(siteHours).forEach(([siteId, hours]) => {
      const site = state.sites.find(s=>s.id===siteId);
      if(!site || !site.billingRate) return;
      const amount = hours * site.billingRate;
      lineItems.push({
        description: `${site.name} — security cover`,
        hours, rate: site.billingRate, amount
      });
      subtotal += amount;
    });
    if(lineItems.length===0) throw new Error('No billable hours. Check site billing rates.');
    const vatAmount = subtotal * (vatRate/100);
    const total = subtotal + vatAmount;
    const invoice = {
      invoiceNumber: 'INV-' + Date.now(),
      clientName: fd.get('clientName').trim(),
      siteName: lineItems.length+' site(s)',
      period: month,
      lineItems,
      subtotal: Math.round(subtotal*100)/100,
      vatRate,
      vatAmount: Math.round(vatAmount*100)/100,
      total: Math.round(total*100)/100,
      status: 'unpaid'
    };
    await saveInvoice(invoice);
    toast('Invoice generated');
    renderInvoicesPage(container);
    generateInvoicePDF(invoice);
  });
}

/* =========================================================
   REPORTS PAGE
   ========================================================= */
async function renderReportsPage(c){
  const rotas = await getRotasForRange('2000-01-01','2099-12-31');
  const siteHours = aggregateHoursBySite(rotas);
  const officerHours = aggregateHoursByOfficer(rotas);
  const invoices = await getInvoices();

  const monthlyRevenue = {};
  invoices.forEach(i => {
    if(!i.period) return;
    monthlyRevenue[i.period] = (monthlyRevenue[i.period]||0) + (i.total||0);
  });

  const outstanding = invoices.filter(i=>i.status!=='paid');

  c.innerHTML = `
    <div class="page-header"><h2>Reports & Analytics</h2></div>

    <div class="card">
      <h3 style="color:var(--primary);margin-bottom:.7rem">Total hours per site</h3>
      ${Object.keys(siteHours).length===0?'<div class="empty">No data.</div>':
        `<div class="table-wrap"><table><thead><tr><th>Site</th><th>Client</th><th>Total Hours</th><th>Est. Revenue</th></tr></thead><tbody>
          ${Object.entries(siteHours).map(([id,hrs])=>{
            const s = state.sites.find(x=>x.id===id);
            const revenue = s?.billingRate ? hrs*s.billingRate : 0;
            return `<tr><td>${s?.name||'—'}</td><td>${s?.clientName||'—'}</td><td>${hrs}</td><td>${fmtMoney(revenue)}</td></tr>`;
          }).join('')}
        </tbody></table></div>`}
    </div>

    <div class="card">
      <h3 style="color:var(--primary);margin-bottom:.7rem">Total hours per officer</h3>
      ${Object.keys(officerHours).length===0?'<div class="empty">No data.</div>':
        `<div class="table-wrap"><table><thead><tr><th>Officer</th><th>Total Hours</th><th>Shifts</th></tr></thead><tbody>
          ${Object.entries(officerHours).map(([id,d])=>{
            const o = state.officers.find(x=>x.id===id);
            return `<tr><td>${o?.name||'—'}</td><td>${d.totalHours}</td><td>${d.shifts.length}</td></tr>`;
          }).join('')}
        </tbody></table></div>`}
    </div>

    <div class="card">
      <h3 style="color:var(--primary);margin-bottom:.7rem">Monthly revenue</h3>
      ${Object.keys(monthlyRevenue).length===0?'<div class="empty">No invoices yet.</div>':
        `<div class="table-wrap"><table><thead><tr><th>Month</th><th>Invoiced Total</th></tr></thead><tbody>
          ${Object.entries(monthlyRevenue).sort().map(([m,v])=>`<tr><td>${m}</td><td>${fmtMoney(v)}</td></tr>`).join('')}
        </tbody></table></div>`}
    </div>

    <div class="card">
      <h3 style="color:var(--primary);margin-bottom:.7rem">Outstanding invoices</h3>
      ${outstanding.length===0?'<div class="empty">All invoices are paid. 🎉</div>':
        `<div class="table-wrap"><table><thead><tr><th>Invoice #</th><th>Client</th><th>Period</th><th>Total</th><th>Status</th></tr></thead><tbody>
          ${outstanding.map(i=>`<tr><td>${i.invoiceNumber}</td><td>${i.clientName}</td><td>${i.period}</td><td>${fmtMoney(i.total)}</td><td><span class="badge ${i.status}">${i.status}</span></td></tr>`).join('')}
        </tbody></table></div>`}
    </div>
  `;
}
