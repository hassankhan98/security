<style>

</style></head><body>
<div id="login"><h2>🛡️ GuardOps</h2><p style="color:var(--mu)">Sign in to manage sites, rotas, payroll and invoices.</p>

<button class="btn" style="width:100%">Sign in</button></form><p><a href="#" onclick="forgot()">Forgot password?</a></p><p id="lerr" style="color:var(--ac)"></p></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyDJN1soJO5fRTBqqMdC7LWVIFZ8AB8F1FY",authDomain:"security-27dc5.firebaseapp.com",projectId:"security-27dc5",storageBucket:"security-27dc5.firebasestorage.app",messagingSenderId:"955382240975",appId:"1:955382240975:web:4e6c98666d2d88c1d2c9ba",measurementId:"G-0XTERCLLTC"});
const auth=firebase.auth(),db=firebase.firestore();
/* ---------- helpers ---------- */

const nm=(c,id)=>(S[c].find(x=>x.id==id)||{}).name||'(deleted)',toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000)};
const DEF={co:'Your Security Ltd',addr:'',phone:'',email:'',vatNo:'',vat:20,terms:30,bank:'',ot:40,otM:1.5,wkM:1.25,nM:1.2,bhM:2,

const S={sites:[],officers:[],shifts:[],invoices:[],payroll:[],cfg:{...DEF}};let view='dash',week=mon(iso(new Date())),month=iso(new Date()).slice(0,7),ui={site:'',mode:'week',off:''},unsub=[];
const put=(c,id,o)=>id?db.collection(c).doc(id).set(o,{merge:true}):db.collection(c).add({...o,created:Date.now()});
const del=async(c,id)=>{if(confirm('Delete this record?'))try{await db.collection(c).doc(id).delete()}catch(e){toast(e.message)}};
/* ---------- auth ---------- */
$('#lf').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($('#em').value,$('#pw').value)}catch(x){$('#lerr').textContent=x.message}};
const forgot=()=>{const m=$('#em').value;if(!m)return $('#lerr').textContent='Enter your email first.';auth.sendPasswordResetEmail(m).then(()=>$('#lerr').textContent='Reset email sent.')};
auth.onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];$('#login').style.display=u?'none':'block';$('#app').style.display=u?'block':'none';if(u){listen();nav()}});

unsub.push(db.doc('settings/main').onSnapshot(d=>{S.cfg={...DEF,...(d.data()||{})};render()}))}
/* ---------- calculations ---------- */
const span=s=>{let a=tm(s.start),b=tm(s.end);if(b<=a)b+=1440;return[a,b]};
const hrs=s=>{const[a,b]=span(s);return Math.max(0,(b-a-(+s.brk||0))/60)};
const nightFrac=s=>{const[a,b]=span(s);let n=0;for(let m=a;m<b;m++){const x=m%1440;if(x>=1320||x<360)n++}return n/(b-a)};

function clash(s,id,extra=[]){const day=x=>Math.round(pd(x)/864e5),[a,b]=span(s),A=day(s.date)*1440+a,B=day(s.date)*1440+b;
return[...S.shifts,...extra].find(x=>{if(x.id===id||x.officerId!=s.officerId)return false;const[c,d]=span(x),C=day(x.date)*1440+c,D=day(x.date)*1440+d;return A<D&&C<B})}
function calcPay(o,m){const C=S.cfg,wk={},L=[];let h=0,ot=0,pay=0;
for(const s of S.shifts.filter(s=>s.officerId==o.id).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))){
const x=hrs(s),w=mon(s.date),before=wk[w]||0;wk[w]=before+x;if(!s.date.startsWith(m))continue;
const o2=Math.max(0,Math.min(x,before+x-C.ot)),k=mult(s),p=(x-o2)*o.rate*k+o2*o.rate*Math.max(k,C.otM);L.push({s,h:x,ot:o2,k,p});h+=x;ot+=o2;pay+=p}
return{h,ot,pay:r2(pay),L}}
const inM=(m,f)=>S.shifts.filter(s=>s.date.startsWith(m)&&(!f||f(s)));
const status=i=>(i.paid>=i.total-.005?['Paid','ok']:i.paid>0?['Partial','']:['Unpaid','bad']);
/* ---------- UI plumbing ---------- */
const NAV=[['dash','Dashboard'],['sites','Sites'],['officers','Officers'],['rota','Rota'],['payroll','Payroll'],['invoices','Invoices'],['reports','Reports'],['set','Settings']];
function nav(){$('#nav').innerHTML='<h2>🛡️ GuardOps</h2>'+NAV.map(n=>`<a class="${view==n[0]?'on':''}" onclick="view='${n[0]}';nav();render()">${n[1]}</a>`).join('')+'<a onclick="auth.signOut()">Sign out</a>';render()}
const M=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()},closeM=()=>$('#dlg').close();

F.forEach(f=>{const val=v[f.k]??f.d??'';h+=`<label>${f.l}</label>`;
if(f.t=='sel')h+=`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==val?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
else if(f.t=='chk')h+=`<div class="chk">${f.o.map(o=>`<label><input type="checkbox" name="${f.k}" value="${o[0]}" ${(v[f.k]||[]).includes(o[0])?'checked':''}> ${esc(o[1])}</label>`).join('')||'<i>none available</i>'}</div>`;
else if(f.t=='ta')h+=`<textarea name="${f.k}" rows="3">${esc(val)}</textarea>`;
else h+=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(val)}" ${f.r?'required':''} ${f.t=='number'?'step="any"':''}>`});
M(h+'<br><div class="bar"><button class="btn">Save</button><button type="button" class="btn ghost" onclick="closeM()">Cancel</button></div></form>');
$('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={};F.forEach(f=>o[f.k]=f.t=='chk'?fd.getAll(f.k):f.t=='number'?+fd.get(f.k):fd.get(f.k));
try{await save(o);closeM()}catch(x){toast(x.message)}}}
const tbl=(H,R)=>`<div class="w"><table><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr>${R.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${H.length}" style="color:var(--mu)">No records yet.</td></tr>`}</table></div>`;
const btn=(t,f,c='')=>`<button class="btn sm ${c}" onclick="${f}">${t}</button> `;
const mpick=()=>`<input type="month" value="${month}" onchange="month=this.value||month;render()">`;
function render(){if(!auth.currentUser)return;const V={dash:dashV,sites:sitesV,officers:officersV,rota:rotaV,payroll:payrollV,invoices:invoicesV,reports:reportsV,set:setV};
$('#main').innerHTML=`<h1>${NAV.find(n=>n[0]==view)[1]}</h1>`+V[view]()}
/* ---------- dashboard ---------- */
function dashV(){const wk=S.shifts.filter(s=>s.date>=week&&s.date<=add(week,6)),mh=inM(month).reduce((a,s)=>a+hrs(s),0),
pay=S.officers.reduce((a,o)=>a+calcPay(o,month).pay,0),inv=S.invoices.filter(i=>i.date.startsWith(month)),out=S.invoices.reduce((a,i)=>a+i.total-i.paid,0);
const st=[['Sites',S.sites.length],['Active officers',S.officers.filter(o=>o.status!='Inactive').length],['Shifts this week',wk.length],['Hours this week',r2(wk.reduce((a,s)=>a+hrs(s),0))],
['Hours '+month,r2(mh)],['Est. payroll '+month,gbp(pay)],['Invoiced '+month,gbp(inv.reduce((a,i)=>a+i.total,0))],['Outstanding',gbp(out)]];
const exp=S.officers.filter(o=>o.siaExpiry&&o.siaExpiry<=add(iso(new Date()),60));
return`<div class="grid">${st.map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>
<div class="card"><b>SIA licences expired / expiring within 60 days</b>${tbl(['Officer','Licence','Expiry'],exp.map(o=>[esc(o.name),esc(o.sia),`<span class="tag bad">${o.siaExpiry}</span>`]))}</div>`}
/* ---------- sites ---------- */
function sitesV(){return`<div class="bar">${btn('+ Add site',"siteF()")}</div><div class="card">`+tbl(['Site','Client','Address','Contact','Rate/hr','Officers',''],S.sites.map(s=>[esc(s.name),esc(s.client),esc(s.address),esc(s.contact)+' '+esc(s.phone),gbp(s.rate),
S.officers.filter(o=>(o.sites||[]).includes(s.id)).map(o=>esc(o.name)).join(', '),btn('Edit',`siteF('${s.id}')`)+btn('Delete',`delSite('${s.id}')`,'red')]))+'</div>'}
function siteF(id){const v=S.sites.find(s=>s.id==id)||{};form(id?'Edit site':'Add site',[{k:'name',l:'Site name',r:1},{k:'client',l:'Client name',r:1},{k:'address',l:'Site address',t:'ta'},{k:'billAddr',l:'Client billing address',t:'ta'},{k:'contact',l:'Contact name'},{k:'phone',l:'Phone'},{k:'email',l:'Email',t:'email'},{k:'rate',l:'Billing rate (£/hr)',t:'number',r:1}],v,o=>put('sites',id,o))}
function delSite(id){if(S.shifts.some(s=>s.siteId==id))return toast('Site has shifts – remove them first.');del('sites',id)}
/* ---------- officers ---------- */
function officersV(){return`<div class="bar">${btn('+ Register officer',"offF()")}Timesheet month: ${mpick()}</div><div class="card">`+tbl(['Name','Phone','SIA licence','Expiry','Rate/hr','Status','Sites',''],S.officers.map(o=>[esc(o.name),esc(o.phone),esc(o.sia),esc(o.siaExpiry),gbp(o.rate),`<span class="tag ${o.status=='Inactive'?'bad':'ok'}">${esc(o.status||'Active')}</span>`,(o.sites||[]).map(i=>esc(nm('sites',i))).join(', '),
btn('Profile',`prof('${o.id}')`,'ghost')+btn('Edit',`offF('${o.id}')`)+btn('Timesheet',`timesheet('${o.id}')`,'ghost')+btn('Delete',`delOff('${o.id}')`,'red')]))+'</div>'}
function offF(id){const v=S.officers.find(s=>s.id==id)||{};form(id?'Edit officer':'Register officer',[{k:'name',l:'Full name',r:1},{k:'phone',l:'Phone'},{k:'email',l:'Email',t:'email'},{k:'address',l:'Address',t:'ta'},{k:'ni',l:'NI number'},{k:'sia',l:'SIA licence number'},{k:'siaType',l:'SIA licence type',d:'Door Supervisor'},{k:'siaExpiry',l:'SIA expiry',t:'date'},{k:'rate',l:'Hourly pay rate (£)',t:'number',r:1},{k:'status',l:'Status',t:'sel',o:[['Active','Active'],['On leave','On leave'],['Inactive','Inactive']]},{k:'sites',l:'Assigned sites',t:'chk',o:S.sites.map(s=>[s.id,s.name])}],v,o=>put('officers',id,o))}
function delOff(id){if(S.shifts.some(s=>s.officerId==id))return toast('Officer has shifts – set status to Inactive instead.');del('officers',id)}
function prof(id){const o=S.officers.find(x=>x.id==id),p=calcPay(o,month),up=S.shifts.filter(s=>s.officerId==id&&s.date>=iso(new Date())).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
M(`<h3>${esc(o.name)} <span class="tag">${esc(o.status||'Active')}</span></h3><p>${esc(o.phone)} · ${esc(o.email)}<br>${esc(o.address)}<br>SIA: ${esc(o.sia)} (${esc(o.siaType)}) exp ${esc(o.siaExpiry)}<br>Rate ${gbp(o.rate)}/hr · NI ${esc(o.ni)}</p>
<p><b>${month}:</b> ${r2(p.h)}h worked, ${r2(p.ot)}h overtime, gross ${gbp(p.pay)}</p><b>Upcoming shifts</b>${tbl(['Date','Site','Time'],up.map(s=>[fmt(s.date),esc(nm('sites',s.siteId)),s.start+'–'+s.end]))}<br><button class="btn ghost" onclick="closeM()">Close</button>`)}
/* ---------- rota ---------- */
function rotaV(){const days=[...Array(7)].map((_,i)=>add(week,i)),sf=ui.site,offs=S.officers.filter(o=>o.status!='Inactive');
let h=`<div class="bar"><button class="btn ghost" onclick="week=add(week,-7);render()">‹</button><input type="date" value="${week}" onchange="week=mon(this.value);render()"><button class="btn ghost" onclick="week=add(week,7);render()">›</button>
<select onchange="ui.mode=this.value;render()">${[['week','Weekly grid'],['month','Monthly list'],['off','Officer view']].map(m=>`<option value="${m[0]}" ${ui.mode==m[0]?'selected':''}>${m[1]}</option>`).join('')}</select>
<select onchange="ui.site=this.value;render()"><option value="">All sites</option>${S.sites.map(s=>`<option value="${s.id}" ${sf==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
${ui.mode=='off'?`<select onchange="ui.off=this.value;render()"><option value="">Select officer</option>${S.officers.map(o=>`<option value="${o.id}" ${ui.off==o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`:''}
${ui.mode=='month'?mpick():''}</div><div class="bar">${btn('+ Add shift',"shiftF()")}${btn('Copy previous week here',"copyWeek(add(week,-7),week)",'ghost')}${btn('Duplicate to next week',"copyWeek(week,add(week,7))",'ghost')}
${btn('Weekly rota PDF',"rotaPdf()",'ghost')}${btn('Print',"rotaPdf(1)",'ghost')}${btn('Officer rota PDF',"offRotaPdf()",'ghost')}${btn('Monthly schedule PDF',"monthPdf()",'ghost')}</div>`;
if(ui.mode=='week'){h+=`<div class="card w"><table><tr><th>Officer</th>${days.map(d=>`<th>${fmt(d).slice(0,10)}</th>`).join('')}<th>Hours</th></tr>`;
offs.forEach(o=>{let tot=0;h+=`<tr><td><b>${esc(o.name)}</b></td>`+days.map(d=>{const L=S.shifts.filter(s=>s.officerId==o.id&&s.date==d&&(!sf||s.siteId==sf));L.forEach(s=>tot+=hrs(s));
return'<td>'+L.map(s=>`<span class="chip ${nightFrac(s)>.5?'n':''}" onclick="shiftF('${s.id}')">${esc(nm('sites',s.siteId))}<br>${s.start}–${s.end} (${r2(hrs(s))}h)</span>`).join('')+`<a style="cursor:pointer;color:var(--mu)" onclick="shiftF('',null,'${o.id}','${d}')">＋</a></td>`}).join('')+`<td>${r2(tot)}</td></tr>`});
return h+'</table></div>'}
const rows=ui.mode=='month'?inM(month,s=>!sf||s.siteId==sf):S.shifts.filter(s=>s.officerId==ui.off&&s.date>=week&&s.date<=add(week,6)&&(!sf||s.siteId==sf));
rows.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
return h+'<div class="card">'+tbl(['Date','Officer','Site','Start','End','Break','Hours',''],rows.map(s=>[fmt(s.date),esc(nm('officers',s.officerId)),esc(nm('sites',s.siteId)),s.start,s.end,s.brk+'m',r2(hrs(s)),btn('Edit',`shiftF('${s.id}')`)]))+`<p><b>Total: ${r2(rows.reduce((a,s)=>a+hrs(s),0))} h</b></p></div>`}
function shiftF(id,_,oid,date){const v=S.shifts.find(s=>s.id==id)||{officerId:oid,date,start:'07:00',end:'19:00',brk:30,siteId:ui.site};
form(id?'Edit shift':'Add shift',[{k:'officerId',l:'Officer',t:'sel',o:S.officers.filter(o=>o.status!='Inactive'||o.id==v.officerId).map(o=>[o.id,o.name])},{k:'siteId',l:'Site',t:'sel',o:S.sites.map(s=>[s.id,s.name])},{k:'date',l:'Date',t:'date',r:1},{k:'start',l:'Start',t:'time',r:1},{k:'end',l:'Finish (earlier than start = overnight)',t:'time',r:1},{k:'brk',l:'Unpaid break (minutes)',t:'number'}],v,async o=>{
if(!o.officerId||!o.siteId)throw Error('Add an officer and a site first.');const c=clash(o,id);if(c)throw Error(`Clash: already on ${nm('sites',c.siteId)} ${c.date} ${c.start}–${c.end}`);await put('shifts',id,o)});
if(id)$('#f').insertAdjacentHTML('beforeend',`<br><button type="button" class="btn red sm" onclick="del('shifts','${id}').then(closeM)">Delete shift</button>`)}
async function copyWeek(from,to){const diff=Math.round((pd(to)-pd(from))/864e5),b=db.batch(),tmp=[];let n=0,k=0;

/* ---------- PDF ---------- */
const J=()=>new window.jspdf.jsPDF({orientation:'landscape'}),P=()=>new window.jspdf.jsPDF();
function head(d,t,sub){const C=S.cfg,w=d.internal.pageSize.getWidth();d.setFillColor(15,52,96);d.rect(0,0,w,24,'F');d.setTextColor(255);d.setFontSize(16);d.text(C.co,12,11);d.setFontSize(8);d.text([C.addr,C.phone+' '+C.email].filter(Boolean).join(' | '),12,18);
d.setFontSize(13);d.text(t,w-12,11,{align:'right'});d.setFontSize(9);d.text(sub||'',w-12,18,{align:'right'});d.setTextColor(0);return 32}
const tab=(d,y,H,B,o={})=>{d.autoTable({startY:y,head:[H],body:B,theme:'grid',styles:{fontSize:8},headStyles:{fillColor:[15,52,96]},...o});return d.lastAutoTable.finalY+6};
function out(d,name,pr){const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(7);d.setTextColor(120);d.text(`Generated ${new Date().toLocaleString('en-GB')} · Page ${i}/${n}`,12,d.internal.pageSize.getHeight()-6)}
if(pr){d.autoPrint();window.open(d.output('bloburl'))}else d.save(name)}
function rotaPdf(pr){const d=J(),days=[...Array(7)].map((_,i)=>add(week,i)),sites=ui.site?S.sites.filter(s=>s.id==ui.site):S.sites.filter(s=>S.shifts.some(x=>x.siteId==s.id&&x.date>=week&&x.date<=add(week,6)));if(!sites.length)return toast('No shifts this week.');
sites.forEach((s,i)=>{if(i)d.addPage();let y=head(d,'WEEKLY ROTA',`${fmt(week)} – ${fmt(add(week,6))}`);d.setFontSize(10);d.text(`Site: ${s.name}  |  Client: ${s.client||''}  |  ${s.address||''}`,12,y-2);
const rows=S.officers.filter(o=>S.shifts.some(x=>x.siteId==s.id&&x.officerId==o.id&&x.date>=week&&x.date<=add(week,6))).map(o=>{let t=0;const r=[o.name,...days.map(dt=>S.shifts.filter(x=>x.siteId==s.id&&x.officerId==o.id&&x.date==dt).map(x=>{t+=hrs(x);return`${x.start}-${x.end}\n(${r2(hrs(x))}h)`}).join('\n')||'-')];r.push(r2(t));return r});
tab(d,y+2,['Officer',...days.map(x=>fmt(x).slice(0,10)),'Total h'],rows)});out(d,`rota_${week}.pdf`,pr)}
function offRotaPdf(){const id=ui.off||prompt('Select an officer in "Officer view" first.')&&'';if(!ui.off)return toast('Choose Officer view and select an officer first.');const o=S.officers.find(x=>x.id==ui.off),d=P();let y=head(d,'OFFICER ROTA',`${fmt(week)} – ${fmt(add(week,6))}`);d.setFontSize(10);d.text(`Officer: ${o.name}   SIA: ${o.sia||'-'}`,12,y-2);
const L=S.shifts.filter(s=>s.officerId==o.id&&s.date>=week&&s.date<=add(week,6)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
y=tab(d,y+2,['Date','Site','Address','Start','End','Break','Hours'],L.map(s=>{const st=S.sites.find(x=>x.id==s.siteId)||{};return[fmt(s.date),st.name,st.address||'',s.start,s.end,s.brk+'m',r2(hrs(s))]}));d.text(`Total hours: ${r2(L.reduce((a,s)=>a+hrs(s),0))}`,12,y);out(d,`rota_${o.name}_${week}.pdf`)}
function monthPdf(){const d=J();let y=head(d,'MONTHLY SCHEDULE',month);const L=inM(month,s=>!ui.site||s.siteId==ui.site).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
y=tab(d,y,['Date','Site','Officer','Start','End','Break','Hours'],L.map(s=>[fmt(s.date),nm('sites',s.siteId),nm('officers',s.officerId),s.start,s.end,s.brk+'m',r2(hrs(s))]));d.text(`Total hours: ${r2(L.reduce((a,s)=>a+hrs(s),0))}`,12,y);out(d,`schedule_${month}.pdf`)}
function timesheet(id){const o=S.officers.find(x=>x.id==id),p=calcPay(o,month),d=P();let y=head(d,'TIMESHEET',month);d.setFontSize(10);d.text(`${o.name}  |  SIA ${o.sia||'-'}`,12,y-2);
y=tab(d,y+2,['Date','Site','Start','End','Break','Hours'],p.L.map(l=>[fmt(l.s.date),nm('sites',l.s.siteId),l.s.start,l.s.end,l.s.brk+'m',r2(l.h)]));d.text(`Total: ${r2(p.h)} h (overtime ${r2(p.ot)} h)`,12,y);out(d,`timesheet_${o.name}_${month}.pdf`)}
/* ---------- payroll ---------- */
const prec=(o,m)=>S.payroll.find(p=>p.id==m+'_'+o.id)||{};
function payrollV(){let tot=0;const rows=S.officers.map(o=>{const p=calcPay(o,month),r=prec(o,month);if(!p.h&&!r.id)return null;const net=r2(p.pay+(r.add||0)-(r.ded||0));tot+=net;
return[esc(o.name),r2(p.h),r2(p.ot),gbp(o.rate),gbp(p.pay),gbp(r.add),gbp(r.ded),'<b>'+gbp(net)+'</b>',`<span class="tag ${r.status=='Paid'?'ok':'bad'}">${r.status||'Unpaid'}</span>`,
btn('Adjust',`adjF('${o.id}')`)+btn(r.status=='Paid'?'Mark unpaid':'Mark paid',`setPaid('${o.id}')`,'ghost')+btn('Payslip',`payslip('${o.id}')`,'ghost')]}).filter(Boolean);
return`<div class="bar">${mpick()}<span>Rates: OT >${S.cfg.ot}h/wk ×${S.cfg.otM}, weekend ×${S.cfg.wkM}, night ×${S.cfg.nM}, bank hol ×${S.cfg.bhM} (change in Settings)</span></div><div class="card">`+tbl(['Officer','Hours','OT h','Rate','Gross','Additions','Deductions','Net','Status',''],rows)+`<p><b>Total net payroll: ${gbp(tot)}</b></p></div>
<div class="card"><b>Payroll history (saved)</b>`+tbl(['Month','Officer','Gross','Net','Status','Paid on'],[...S.payroll].sort((a,b)=>b.month.localeCompare(a.month)).map(p=>[p.month,esc(nm('officers',p.officerId)),gbp(p.gross),gbp(p.net),p.status,p.paidOn||'']))+'</div>'}
async function saveRec(o,extra){const p=calcPay(o,month),r=prec(o,month),n={...r,...extra};delete n.id;const rec={officerId:o.id,month,hours:r2(p.h),gross:p.pay,add:n.add||0,addNote:n.addNote||'',ded:n.ded||0,dedNote:n.dedNote||'',status:n.status||'Unpaid',paidOn:n.paidOn||''};rec.net=r2(rec.gross+rec.add-rec.ded);
await db.collection('payroll').doc(month+'_'+o.id).set(rec)}
function adjF(id){const o=S.officers.find(x=>x.id==id);form('Adjustments – '+o.name,[{k:'add',l:'Additional payment (£)',t:'number'},{k:'addNote',l:'Reason'},{k:'ded',l:'Deduction (£)',t:'number'},{k:'dedNote',l:'Reason'}],prec(o,month),x=>saveRec(o,x))}
const setPaid=id=>{const o=S.officers.find(x=>x.id==id),paid=prec(o,month).status=='Paid';return saveRec(o,{status:paid?'Unpaid':'Paid',paidOn:paid?'':iso(new Date())})};
function payslip(id){const o=S.officers.find(x=>x.id==id),p=calcPay(o,month),r=prec(o,month),d=P();let y=head(d,'PAYSLIP',month);d.setFontSize(10);d.text([`Employee: ${o.name}`,`Address: ${o.address||'-'}`,`NI: ${o.ni||'-'}   SIA: ${o.sia||'-'}`,`Hourly rate: ${gbp(o.rate)}`],12,y);
y=tab(d,y+22,['Date','Site','Time','Hours','OT h','Multiplier','Amount'],p.L.map(l=>[fmt(l.s.date),nm('sites',l.s.siteId),l.s.start+'-'+l.s.end,r2(l.h),r2(l.ot),'×'+l.k.toFixed(2),gbp(l.p)]));
const net=r2(p.pay+(r.add||0)-(r.ded||0));y=tab(d,y,['Summary','Amount'],[['Gross pay ('+r2(p.h)+' h)',gbp(p.pay)],['Additional: '+(r.addNote||'-'),gbp(r.add)],['Deductions: '+(r.dedNote||'-'),'-'+gbp(r.ded)],['NET PAY',gbp(net)],['Status',r.status||'Unpaid']],{tableWidth:100});
d.setFontSize(7);d.text('Tax/NI/pension are not calculated by this system – enter them as deductions.',12,y);out(d,`payslip_${o.name}_${month}.pdf`)}
/* ---------- invoices ---------- */
function invoicesV(){return`<div class="bar">${btn('+ Generate invoice',"invF()")}</div><div class="card">`+tbl(['No.','Date','Client / site','Period','Subtotal','VAT','Total','Paid','Status',''],[...S.invoices].sort((a,b)=>b.number.localeCompare(a.number)).map(i=>{const s=status(i);return[i.number,i.date,esc(i.client)+' – '+esc(i.siteName),i.from+' → '+i.to,gbp(i.subtotal),gbp(i.vat),'<b>'+gbp(i.total)+'</b>',gbp(i.paid),`<span class="tag ${s[1]}">${s[0]}</span>`,
btn('PDF',`invPdf('${i.id}')`,'ghost')+btn('Payment',`payF('${i.id}')`)+btn('Delete',`del('invoices','${i.id}')`,'red')]}))+'</div>'}
function invF(){form('Generate invoice',[{k:'siteId',l:'Site',t:'sel',o:S.sites.map(s=>[s.id,s.name])},{k:'type',l:'Billing period',t:'sel',o:[['week','Weekly (week containing date)'],['month','Monthly (month containing date)'],['custom','Custom range']]},{k:'from',l:'Date / start',t:'date',d:week,r:1},{k:'to',l:'End (custom only)',t:'date'}],{},async o=>{
const s=S.sites.find(x=>x.id==o.siteId);if(!s)throw Error('Add a site first.');let f=o.from,t=o.to||o.from;if(o.type=='week'){f=mon(o.from);t=add(f,6)}if(o.type=='month'){f=o.from.slice(0,8)+'01';const e=pd(f);e.setMonth(e.getMonth()+1);t=add(iso(e),-1)}
const L=S.shifts.filter(x=>x.siteId==s.id&&x.date>=f&&x.date<=t).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(x=>({date:x.date,officer:nm('officers',x.officerId),time:x.start+'-'+x.end,hours:r2(hrs(x)),rate:+s.rate,amount:r2(hrs(x)*s.rate)}));
if(!L.length)throw Error('No shifts at this site in that period.');if(S.invoices.some(i=>i.siteId==s.id&&i.from<=t&&i.to>=f)&&!confirm('An invoice already covers part of this period. Continue?'))throw Error('Cancelled.');
const sub=r2(L.reduce((a,l)=>a+l.amount,0)),vr=+S.cfg.vat,vat=r2(sub*vr/100),n=Math.max(0,...S.invoices.map(i=>+i.number.split('-').pop()))+1;
await put('invoices',null,{number:'INV-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0'),date:iso(new Date()),due:add(iso(new Date()),+S.cfg.terms),siteId:s.id,siteName:s.name,client:s.client,billAddr:s.billAddr||s.address||'',from:f,to:t,lines:L,subtotal:sub,vatRate:vr,vat,total:r2(sub+vat),paid:0})})}
function payF(id){const i=S.invoices.find(x=>x.id==id);form(`Payment – ${i.number} (balance ${gbp(i.total-i.paid)})`,[{k:'amt',l:'Amount received (£)',t:'number',r:1}],{amt:r2(i.total-i.paid)},o=>put('invoices',id,{paid:r2(Math.min(i.total,i.paid+o.amt))}))}
function invPdf(id){const i=S.invoices.find(x=>x.id==id),C=S.cfg,d=P();let y=head(d,'INVOICE',i.number);d.setFontSize(9);d.text([`Bill to: ${i.client}`,...String(i.billAddr).split('\n'),'',`Site: ${i.siteName}`],12,y);
d.text([`Invoice date: ${i.date}`,`Due: ${i.due}`,`Period: ${i.from} to ${i.to}`,C.vatNo?`VAT No: ${C.vatNo}`:''],130,y);
y=tab(d,y+30,['Date','Officer','Time','Hours','Rate','Amount'],i.lines.map(l=>[fmt(l.date),l.officer,l.time,l.hours,gbp(l.rate),gbp(l.amount)]));
y=tab(d,y,['Summary',''],[['Subtotal',gbp(i.subtotal)],[`VAT (${i.vatRate}%)`,gbp(i.vat)],['TOTAL',gbp(i.total)],['Paid',gbp(i.paid)],['BALANCE DUE',gbp(i.total-i.paid)]],{tableWidth:90,margin:{left:108}});
d.setFontSize(9);d.text(['Payment details:',...String(C.bank||'').split('\n'),`Terms: ${C.terms} days`],12,y);out(d,`${i.number}.pdf`)}
/* ---------- reports ---------- */
function reportsV(){const sh=inM(month),by=(k,c)=>Object.entries(sh.reduce((a,s)=>(a[s[k]]=(a[s[k]]||0)+hrs(s),a),{})).map(([id,h])=>[esc(nm(c,id)),r2(h)]);
const pr=S.officers.map(o=>{const p=calcPay(o,month),r=prec(o,month);return p.pay+(r.add||0)-(r.ded||0)}).reduce((a,b)=>a+b,0),inv=S.invoices.filter(i=>i.date.startsWith(month)),rev=inv.reduce((a,i)=>a+i.total,0),recv=inv.reduce((a,i)=>a+i.paid,0),o=S.invoices.filter(i=>i.paid<i.total);
return`<div class="bar">${mpick()}</div><div class="grid"><div class="card stat"><b>${gbp(pr)}</b><span>Payroll</span></div><div class="card stat"><b>${gbp(rev)}</b><span>Revenue invoiced</span></div><div class="card stat"><b>${gbp(recv)}</b><span>Received on those</span></div><div class="card stat"><b>${gbp(rev-pr)}</b><span>Gross margin (invoiced − payroll)</span></div></div>
<div class="card"><b>Hours per site</b>${tbl(['Site','Hours'],by('siteId','sites'))}</div><div class="card"><b>Hours per officer</b>${tbl(['Officer','Hours'],by('officerId','officers'))}</div>
<div class="card"><b>Outstanding invoices</b>${tbl(['No.','Client','Due','Balance'],o.map(i=>[i.number,esc(i.client),i.due,'<b>'+gbp(i.total-i.paid)+'</b>']))}</div>`}
/* ---------- settings ---------- */
function setV(){return`<div class="card"><p>Company details, VAT and pay multipliers used for rotas, payslips and invoices.</p>${btn('Edit settings',"setF()")}<br><br>${esc(S.cfg.co)} · VAT ${S.cfg.vat}% · Payment terms ${S.cfg.terms} days</div>`}
function setF(){form('Settings',[{k:'co',l:'Company name'},{k:'addr',l:'Address'},{k:'phone',l:'Phone'},{k:'email',l:'Email'},{k:'vatNo',l:'VAT number'},{k:'vat',l:'VAT %',t:'number'},{k:'terms',l:'Payment terms (days)',t:'number'},{k:'bank',l:'Bank details (for invoices)',t:'ta'},{k:'ot',l:'Overtime after (hours/week)',t:'number'},{k:'otM',l:'Overtime multiplier',t:'number'},{k:'wkM',l:'Weekend multiplier',t:'number'},{k:'nM',l:'Night multiplier (22:00–06:00)',t:'number'},{k:'bhM',l:'Bank holiday multiplier',t:'number'},{k:'bh',l:'Bank holiday dates (YYYY-MM-DD, comma separated)',t:'ta'}],S.cfg,o=>db.doc('settings/main').set(o))}
</script></body></html>
